# Only rows owned by this bundle. A third-party plugin must never be inserted
# from here: a bare package name also carries that plugin's browser half, and a
# second copy of it can abort the whole desktop boot (docs/crash-investigation-0.3.1.md).
# OFM is detected at runtime and installed by the user through the host's plugin manager.
- insert:
    - id: baifanyu-ofm
      name: baifanyu-ofm/plugin
      config: {}
